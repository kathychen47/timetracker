<!DOCTYPE html>
<title>时间管理 · 初版</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  :root{
    --bg:#ffffff;--surface:#f7f8fa;--surface-2:#eef0f4;--border:#e7e9ef;--line:#eef0f5;
    --text:#262a35;--muted:#767d8d;
    --primary:#6366f1;--primary-soft:#eef0fe;--primary-ink:#ffffff;
    --cat-focus:#ec8b76;--cat-meeting:#5f9bd8;--cat-sport:#5cbd90;--cat-study:#9d8bd8;
    --cat-goal:#eeb85f;--cat-habit:#61c4cf;--cat-life:#9aa1b0;
    --danger:#e5786e;--now:#ef5350;
    --radius:14px;--radius-sm:10px;
    --shadow:0 1px 2px rgba(30,34,54,.05), 0 12px 30px -16px rgba(30,34,54,.16);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  @media (prefers-color-scheme: dark){:root{
    --bg:#15171c;--surface:#1c1f26;--surface-2:#252932;--border:#2c313b;--line:#23262f;
    --text:#e6e8ef;--muted:#949bab;--primary:#818cf8;--primary-soft:#262a44;--primary-ink:#15171c;
    --cat-focus:#f0a48f;--cat-meeting:#7bb2e2;--cat-sport:#75cca2;--cat-study:#b2a4e2;
    --cat-goal:#f2c47c;--cat-habit:#7cd1db;--cat-life:#9aa1b0;--danger:#ef8b81;--now:#ff6b66;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.7);}}
  :root[data-theme="light"]{
    --bg:#ffffff;--surface:#f7f8fa;--surface-2:#eef0f4;--border:#e7e9ef;--line:#eef0f5;
    --text:#262a35;--muted:#767d8d;--primary:#6366f1;--primary-soft:#eef0fe;--primary-ink:#ffffff;
    --cat-focus:#ec8b76;--cat-meeting:#5f9bd8;--cat-sport:#5cbd90;--cat-study:#9d8bd8;
    --cat-goal:#eeb85f;--cat-habit:#61c4cf;--cat-life:#9aa1b0;--danger:#e5786e;--now:#ef5350;
    --shadow:0 1px 2px rgba(30,34,54,.05), 0 12px 30px -16px rgba(30,34,54,.16);}
  :root[data-theme="dark"]{
    --bg:#15171c;--surface:#1c1f26;--surface-2:#252932;--border:#2c313b;--line:#23262f;
    --text:#e6e8ef;--muted:#949bab;--primary:#818cf8;--primary-soft:#262a44;--primary-ink:#15171c;
    --cat-focus:#f0a48f;--cat-meeting:#7bb2e2;--cat-sport:#75cca2;--cat-study:#b2a4e2;
    --cat-goal:#f2c47c;--cat-habit:#7cd1db;--cat-life:#9aa1b0;--danger:#ef8b81;--now:#ff6b66;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 14px 34px -18px rgba(0,0,0,.7);}

  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;
    transition:background .3s,color .3s}
  button,input,select{font-family:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--surface-2);border-radius:9px}

  .app{display:flex;min-height:100vh}
  /* icon rail */
  .rail{width:58px;flex:none;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0;position:sticky;top:0;height:100vh}
  .rail .logo{width:32px;height:32px;border-radius:9px;background:var(--primary);color:var(--primary-ink);
    display:grid;place-items:center;margin-bottom:8px}
  .rail .logo svg{width:18px;height:18px}
  .rail button{width:38px;height:38px;border:none;background:transparent;color:var(--muted);border-radius:10px;
    display:grid;place-items:center;cursor:pointer}
  .rail button svg{width:19px;height:19px}
  .rail button:hover{background:var(--surface-2);color:var(--text)}
  .rail button.on{background:var(--primary-soft);color:var(--primary)}
  .rail button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  .rail .grow{flex:1}

  main{flex:1;min-width:0;max-width:1460px;margin:0 auto;padding:18px 18px 60px;width:100%}
  .view{display:none}.view.on{display:block}

  /* calendar + dashboard layout */
  .cal-layout{display:grid;grid-template-columns:262px minmax(0,1fr) 230px;gap:14px;align-items:start}
  @media (max-width:1160px){.cal-layout{grid-template-columns:260px minmax(0,1fr)}.pomo-col{grid-column:1 / -1}}
  @media (max-width:900px){.cal-layout{grid-template-columns:1fr}.pomo-col{grid-column:auto}}
  .cal-main{min-width:0}.pomo-col{min-width:0}
  .dash{display:flex;flex-direction:column;gap:14px}
  .dash-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px}
  .dash-h{font-size:12px;font-weight:640;color:var(--muted);letter-spacing:.6px;text-transform:uppercase;
    display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

  /* mini calendar */
  .mc-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .mc-bar b{font-size:13.5px;font-weight:640}
  .mc-bar button{width:26px;height:26px;border:none;background:transparent;color:var(--muted);border-radius:7px;cursor:pointer;display:grid;place-items:center}
  .mc-bar button:hover{background:var(--surface-2)}.mc-bar button svg{width:14px;height:14px}
  .mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .mc-grid .wd{font-size:10px;color:var(--muted);text-align:center;padding-bottom:4px}
  .mc-grid .dd{aspect-ratio:1;display:grid;place-items:center;font-size:11.5px;border-radius:7px;cursor:pointer;
    position:relative;font-variant-numeric:tabular-nums}
  .mc-grid .dd:hover{background:var(--surface-2)}
  .mc-grid .dd.dim{color:var(--muted);opacity:.5}
  .mc-grid .dd.today{background:var(--primary);color:var(--primary-ink)}
  .mc-grid .dd.sel{box-shadow:inset 0 0 0 1.5px var(--primary)}
  .mc-grid .dd .ev-dot{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--primary)}
  .mc-grid .dd.today .ev-dot{background:var(--primary-ink)}

  /* due list */
  .due-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;margin-bottom:8px;
    background:color-mix(in srgb,var(--u) 15%,var(--bg));border:1px solid color-mix(in srgb,var(--u) 30%,var(--bg))}
  .due-item:last-child{margin-bottom:0}
  .due-badge{flex:none;text-align:center;min-width:38px}
  .due-badge b{font-size:17px;font-weight:700;color:color-mix(in srgb,var(--u) 75%,var(--text));font-variant-numeric:tabular-nums;line-height:1}
  .due-badge span{font-size:9.5px;color:color-mix(in srgb,var(--u) 60%,var(--muted));display:block}
  .due-body{min-width:0}
  .due-body .dt{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .due-body .dm{font-size:11px;color:var(--muted);margin-top:1px}
  .dash-empty{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 0}

  /* memos */
  .memo-input{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);
    color:var(--text);font-size:13px;margin-bottom:9px}
  .memo{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:var(--bg);
    border:1px solid var(--border);margin-bottom:7px;font-size:12.5px;line-height:1.5}
  .memo:last-child{margin-bottom:0}
  .memo .mtx{flex:1;min-width:0;word-break:break-word}
  .memo .mdel{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:0 2px;flex:none}
  .memo .mdel:hover{color:var(--danger)}
  .dash-add{border:none;background:transparent;color:var(--primary);font-size:12px;cursor:pointer;font-weight:600;letter-spacing:0}
  .goal-item{margin-bottom:13px}.goal-item:last-child{margin-bottom:0}
  .goal-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
  .goal-top .gt{font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .goal-top .gv{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
  .goal-bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .goal-bar i{display:block;height:100%;border-radius:99px;background:var(--gc,var(--primary))}
  .goal-row2{display:flex;align-items:center;gap:8px;margin-top:5px}
  .goal-row2 .gsub{font-size:10.5px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .goal-plus{border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:11px;padding:3px 9px;border-radius:7px;cursor:pointer;flex:none}
  .goal-plus:hover{background:var(--surface-2)}
  .hm-wrap{overflow-x:auto;padding:2px 0 6px}
  .hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px;width:max-content}
  .hm-c{width:12px;height:12px;border-radius:3px}
  .hm-legend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);justify-content:flex-end;margin-bottom:14px}
  .hm-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
  .gd-h{font-size:12px;font-weight:640;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:4px 0 8px}
  .gd-ev{display:flex;gap:10px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line)}
  .gd-ev>span:first-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .gd-ev .ge-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gd-ev .ge-v{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .gd-ev .ge-del{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;flex:none}
  .gd-ev .ge-del:hover{color:var(--danger)}

  /* pomodoro (in dashboard) */
  .pomo-side-h{font-size:12px;font-weight:640;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
  .pomo-mode-seg{align-self:center}
  .pomo-task{display:flex;flex-direction:column;gap:9px}
  .pomo-task input[type=text]{padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-size:13.5px;text-align:center}
  .pomo-task-cat{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
  .pomo-task-cat select{padding:7px 9px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font-size:12.5px}
  .pomo-log{display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;color:var(--muted);cursor:pointer}
  .pomo-log input{width:14px;height:14px;accent-color:var(--primary)}
  .ring{width:168px;height:168px;border-radius:50%;margin:6px auto 0;display:grid;place-items:center;
    background:conic-gradient(var(--cat-focus) calc(var(--p,0)*1%), var(--surface-2) 0)}
  .ring.brk{background:conic-gradient(var(--cat-sport) calc(var(--p,0)*1%), var(--surface-2) 0)}
  .ring .in{width:140px;height:140px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
  .ring .in .time{font-size:31px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .ring .in .mode{font-size:12px;color:var(--muted);margin-top:2px;max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 6px}
  .pomo-side .dash-card2{display:flex;flex-direction:column;gap:11px}
  .pomo-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .pomo-btns .btn{padding:9px 15px;font-size:13px}
  .pomo-set{display:flex;gap:14px;justify-content:center}
  .pomo-set label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px;align-items:center}
  .pomo-set input{width:58px;text-align:center;padding:7px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}
  .pomo-stat{display:flex;gap:10px;justify-content:center}
  .pomo-stat .s{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px 12px;flex:1;text-align:center;min-width:0}
  .pomo-stat .s .k{font-size:11px;color:var(--muted)}
  .pomo-stat .s .v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .pomo-stat .s .v small{font-size:11px;font-weight:500;color:var(--muted)}

  /* buttons/seg shared */
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12.5px;padding:7px 12px;border-radius:9px;cursor:pointer}
  .btn:hover{background:var(--surface-2)}
  .btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent;font-weight:550}
  .btn.primary:hover{filter:brightness(1.05)}
  .seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
  .seg button{border:none;background:transparent;color:var(--muted);font-size:13px;padding:6px 14px;border-radius:7px;cursor:pointer}
  .seg button.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.09)}

  /* calendar panel */
  .cal{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
  .cal-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
  .cal-nav{display:flex;align-items:center;gap:9px}
  .arrow{width:31px;height:31px;border:1px solid var(--border);background:var(--surface);border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
  .arrow:hover{background:var(--surface-2)}.arrow svg{width:15px;height:15px}
  .cal-title{font-size:16px;font-weight:640;margin-left:2px}
  .cal-title em{font-style:normal;color:var(--muted);font-weight:450;font-size:13px;margin-left:6px}
  .cal-scroll{overflow-x:auto}

  /* event block (week/day) style B deep + label + checkbox */
  .ev{border-radius:9px;overflow:hidden;cursor:pointer;position:relative;
    background:color-mix(in srgb,var(--c) 35%,var(--bg))}
  .ev .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--c) 72%,var(--text))}
  .ev .h{font-variant-numeric:tabular-nums;color:color-mix(in srgb,var(--c) 55%,var(--muted))}
  .ev .lbl{font-size:9.5px;color:color-mix(in srgb,var(--c) 48%,var(--muted));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev .chk{position:absolute;right:3px;bottom:3px;width:14px;height:14px;border-radius:4px;border:1.4px solid color-mix(in srgb,var(--c) 55%,var(--muted));background:var(--bg);display:grid;place-items:center;cursor:pointer}
  .ev .chk svg{width:9px;height:9px;color:var(--primary-ink);opacity:0}
  .ev.done{opacity:.55}
  .ev.done .chk{background:color-mix(in srgb,var(--c) 70%,var(--text));border-color:transparent}
  .ev.done .chk svg{opacity:1;color:var(--bg)}
  .ev.done .t{text-decoration:line-through}
  .ev.gcal{border:1px dashed color-mix(in srgb,var(--c) 55%,var(--border))}
  .ev .gtag{position:absolute;right:3px;bottom:3px;font-size:9px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:4px;line-height:13px;padding:0 3px}

  /* week + single-day grid */
  .grid-head{display:grid;border-bottom:1px solid var(--border)}
  .grid-head .gh{padding:8px 4px;text-align:center;border-left:1px solid var(--line)}
  .grid-head .gh:first-child{border-left:none}
  .grid-head .gh .n{font-size:11px;color:var(--muted)}
  .grid-head .gh .d{font-size:15px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;cursor:pointer}
  .grid-head .gh.today .d{background:var(--primary);color:var(--primary-ink);font-size:13px}
  .grid-body{display:grid;position:relative}
  .gutter{position:relative}
  .gutter span{position:absolute;right:6px;font-size:10px;color:var(--muted);transform:translateY(-6px);font-variant-numeric:tabular-nums}
  .col{position:relative;border-left:1px solid var(--line);cursor:pointer;
    background:repeating-linear-gradient(var(--bg) 0,var(--bg) 43px,var(--line) 43px,var(--line) 44px)}
  .col.today{background:repeating-linear-gradient(color-mix(in srgb,var(--primary) 5%,var(--bg)) 0,color-mix(in srgb,var(--primary) 5%,var(--bg)) 43px,var(--line) 43px,var(--line) 44px)}
  .col .ev{position:absolute;left:3px;right:3px;padding:4px 7px}
  .col .ev .t{font-size:11.5px;line-height:1.2}.col .ev .h{font-size:10px}.col .ev .lbl{margin-top:1px}

  /* now line */
  .now-line{position:absolute;height:0;border-top:2px solid var(--now);z-index:5;pointer-events:none}
  .now-line::before{content:"";position:absolute;left:-4px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--now)}
  .drag-pv{position:absolute;left:3px;right:3px;background:color-mix(in srgb,var(--primary) 20%,var(--bg));border:1.5px dashed var(--primary);border-radius:8px;pointer-events:none;z-index:6}
  .col,.dv-col{user-select:none}

  /* DAY MATRIX view */
  .dv{overflow-x:auto}
  .dv-inner{display:flex;min-width:max-content}
  .dv-time{flex:none;width:46px}
  .dv-head-sp{height:46px;border-bottom:1px solid var(--border)}
  .dv-hours{position:relative}
  .dv-hours span{position:absolute;right:6px;font-size:10px;color:var(--muted);transform:translateY(-6px);font-variant-numeric:tabular-nums}
  .dv-body{position:relative}
  .dv-row-head{display:flex;height:46px;border-bottom:1px solid var(--border)}
  .dv-gh{border-left:1px solid var(--border);display:flex;flex-direction:column}
  .dv-gh-name{height:22px;line-height:22px;font-size:12.5px;font-weight:640;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--c) 72%,var(--text))}
  .dv-gh-subs{display:flex;flex:1}
  .dv-sh{width:150px;flex:none;font-size:11px;color:var(--muted);padding:2px 8px;border-left:1px solid var(--line);display:flex;align-items:center}
  .dv-sh:first-child{border-left:none}
  .dv-cols{display:flex;position:relative}
  .dv-col{width:150px;flex:none;position:relative;border-left:1px solid var(--line);
    background:repeating-linear-gradient(var(--bg) 0,var(--bg) 43px,var(--line) 43px,var(--line) 44px);cursor:pointer}
  .dv-gh:first-child,.dv-col:first-child{border-left:1px solid var(--border)}
  .dv-col .ev{position:absolute;left:3px;right:3px;padding:4px 7px}
  .dv-col .ev .t{font-size:11.5px;line-height:1.2}.dv-col .ev .h{font-size:10px}
  .dv-empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:13.5px}

  /* month */
  .m-head{display:grid;grid-template-columns:repeat(7,1fr)}
  .m-head div{padding:8px 4px;text-align:center;font-size:11.5px;color:var(--muted);border-bottom:1px solid var(--border)}
  .m-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:96px}
  .cell{border-left:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer}
  .cell:nth-child(7n+1){border-left:none}
  .cell .dn{font-size:12px;font-weight:550;width:23px;height:23px;display:grid;place-items:center;border-radius:50%;font-variant-numeric:tabular-nums}
  .cell.dim{opacity:.4}.cell.today .dn{background:var(--primary);color:var(--primary-ink)}
  .pill{display:flex;align-items:center;gap:5px;padding:2px 7px;border-radius:7px;min-width:0;background:color-mix(in srgb,var(--c) 35%,var(--bg))}
  .pill i{width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
  .pill b{font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:color-mix(in srgb,var(--c) 72%,var(--text))}
  .cell .more{font-size:10px;color:var(--muted);padding-left:2px}

  .legend{display:flex;flex-wrap:wrap;gap:8px 15px;margin-top:14px;padding:0 2px}
  .legend .li{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
  .legend .li i{width:11px;height:11px;border-radius:4px;background:var(--c)}

  /* todos */
  .page-h{font-size:19px;font-weight:680;margin:2px 0 16px}
  .todo-wrap{max-width:640px;margin:0 auto}

<script>
(function(){
  "use strict";
  var LS=window.localStorage;
  function load(k,d){try{var v=LS.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
  function save(k,v){try{LS.setItem(k,JSON.stringify(v));}catch(e){}}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function pad(n){return(n<10?"0":"")+n;}
  function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function parse(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
  function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function addMonths(d,n){var x=new Date(d);x.setMonth(x.getMonth()+n);return x;}
  function startOfWeek(d){var x=new Date(d);var day=(x.getDay()+6)%7;return addDays(x,-day);}
  function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  var WD=["一","二","三","四","五","六","日"];

  // ---------- categories (2-level) ----------
  var PRESET_KEYS=["focus","meeting","sport","study","goal","habit","life"];
  var DEFAULT_CATS=[
    {key:"focus",name:"专注",color:"var(--cat-focus)",kw:["专注","写代码","开发","coding","编程","方案"],subs:[]},
    {key:"meeting",name:"会议",color:"var(--cat-meeting)",kw:["会","会议","评审","对齐","沟通","面试","汇报","例会"],subs:[]},
    {key:"sport",name:"运动",color:"var(--cat-sport)",kw:["健身","跑步","运动","锻炼","爬山","游泳","球","瑜伽"],subs:[]},
    {key:"study",name:"学习",color:"var(--cat-study)",kw:["学习","看书","读书","课","复习"],subs:[
      {key:"s-eng",name:"学英语",kw:["英语","背单词","单词","口语","听力"]},
      {key:"s-read",name:"阅读",kw:["阅读","读书","看书"]}
    ]},
    {key:"goal",name:"目标",color:"var(--cat-goal)",kw:["目标","复盘","总结","规划","计划"],subs:[]},
    {key:"habit",name:"习惯",color:"var(--cat-habit)",kw:["冥想","早起","喝水","日记","打卡"],subs:[]},
    {key:"life",name:"生活",color:"var(--cat-life)",kw:["午餐","吃饭","晚餐","休息","购物","家务","睡"],subs:[]}
  ];
  var PALETTE=["#ec8b76","#5f9bd8","#5cbd90","#9d8bd8","#eeb85f","#61c4cf","#e57ea0","#7c83e6","#8bb04f","#d9925f","#54bcae","#9aa1b0"];
  var cats=load("tt_cats",null);if(cats===null){cats=DEFAULT_CATS;save("tt_cats",cats);}
  function parentObj(k){for(var i=0;i<cats.length;i++)if(cats[i].key===k)return cats[i];return null;}
  function catIndex(k){for(var i=0;i<cats.length;i++)if(cats[i].key===k)return i;return 99;}
  function subsOf(k){var p=parentObj(k);return p&&p.subs?p.subs:[];}
  function subName(pk,sk){var s=subsOf(pk);for(var i=0;i<s.length;i++)if(s[i].key===sk)return s[i].name;return "";}
  function catColor(k){var p=parentObj(k);return p?p.color:"var(--cat-focus)";}
  function catName(k){var p=parentObj(k);return p?p.name:"专注";}
  function autoCat(title){
    for(var i=0;i<cats.length;i++){var subs=cats[i].subs||[];
      for(var s=0;s<subs.length;s++){var kw=subs[s].kw||[];
        for(var j=0;j<kw.length;j++){if(kw[j]&&title.indexOf(kw[j])>=0)return{cat:cats[i].key,sub:subs[s].key};}}}
    for(var a=0;a<cats.length;a++){var pk=cats[a].kw||[];
      for(var b=0;b<pk.length;b++){if(pk[b]&&title.indexOf(pk[b])>=0)return{cat:cats[a].key,sub:null};}}
    return{cat:"focus",sub:null};
  }

  // ---------- state / data ----------
  var events=load("tt_events",null),todos=load("tt_todos",null),memos=load("tt_memos",null);
  var settings=load("tt_settings",{theme:null,focus:25,brk:5}),pstats=load("tt_pstats",{});
  var state={view:"week",cursor:new Date(),tab:"calendar"};
  var miniCursor=new Date();
  var GCAL_CLIENT_ID="707528813420-9pme43aec9r8bn66a5tbk9i4kb2tepg3.apps.googleusercontent.com";
  var gToken=null,gcalEvents=[];

  if(events===null){
    var mon=startOfWeek(new Date());
    function E(off,s,e,title,cat,sub){return{id:uid(),date:fmt(addDays(mon,off)),start:s,end:e,title:title,cat:cat,sub:sub||null,done:false};}
    events=[
      E(0,"09:00","10:00","团队会议","meeting",null),
      E(0,"10:30","12:00","专注 · 写方案","focus",null),
      E(0,"18:00","19:00","健身","sport",null),
      E(1,"14:00","15:30","背单词","study","s-eng"),
      E(1,"16:00","16:30","周目标复盘","goal",null),
      E(2,"09:00","09:30","晨会","meeting",null),
      E(2,"10:00","11:30","专注 · 开发","focus",null),
      E(2,"14:00","15:00","读书","study","s-read"),
      E(2,"17:00","18:00","跑步","sport",null),
      E(3,"11:00","12:00","需求评审","meeting",null),
      E(4,"09:00","09:30","写周报","meeting",null),
      E(5,"10:00","11:00","爬山","sport",null)
    ];
    save("tt_events",events);
  }
  if(todos===null){todos=[
    {id:uid(),title:"完成项目方案初稿",prio:"high",due:fmt(new Date()),done:false},
    {id:uid(),title:"回复客户邮件",prio:"mid",due:fmt(addDays(new Date(),1)),done:false},
    {id:uid(),title:"整理本周会议纪要",prio:"low",due:"",done:true}
  ];save("tt_todos",todos);}
  if(memos===null){memos=[{id:uid(),text:"和导师同步：带上一页纸的研究动机 + 两个设计方案。"}];save("tt_memos",memos);}
  var goals=load("tt_goals",null);
  if(goals===null){goals=[
    {id:uid(),title:"背单词",type:"time",target:5,period:"week",cat:"study",sub:"s-eng",keyword:null},
    {id:uid(),title:"游泳",type:"count",target:10,period:"month",cat:"sport",sub:null,keyword:"游泳"}
  ];save("tt_goals",goals);}

  // ---------- theme ----------
  var root=document.documentElement,themeBtn=document.getElementById("theme-btn");
  var SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>';
  var MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>';
  function curTheme(){var t=root.getAttribute("data-theme");return t?t:(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}
  function applyTheme(t){root.setAttribute("data-theme",t);themeBtn.innerHTML=(t==="dark"?MOON:SUN);settings.theme=t;save("tt_settings",settings);}
  applyTheme(settings.theme||curTheme());
  themeBtn.addEventListener("click",function(){applyTheme(curTheme()==="dark"?"light":"dark");});

  // ---------- rail nav ----------
  document.querySelector(".rail").addEventListener("click",function(e){
    var b=e.target.closest("button[data-tab]");if(!b)return;
    var tab=b.getAttribute("data-tab");state.tab=tab;
    document.querySelectorAll(".rail button[data-tab]").forEach(function(x){x.classList.toggle("on",x===b);});
    ["calendar","todo","stats"].forEach(function(k){document.getElementById("view-"+k).classList.toggle("on",k===tab);});
    if(tab==="stats")renderStatsView();
    if(tab==="todo")renderTodos();
  });

  // ---------- calendar core ----------
  var HS=7,HE=23,PH=44,GH=(HE-HS)*PH;
  var calBody=document.getElementById("cal-body"),calTitle=document.getElementById("cal-title");
  function eventsOn(ds){
    var local=events.filter(function(e){return e.date===ds;});
    var gids={};local.forEach(function(e){if(e.gid)gids[e.gid]=1;});
    var g=gcalEvents.filter(function(e){return e.date===ds&&!gids[e.id.slice(2)];});
    return local.concat(g);
  }
  function toMin(s){var p=s.split(":");return(+p[0])*60+(+p[1]);}
  function evMinutes(e){var s=toMin(e.start),en=toMin(e.end);return en>s?en-s:0;}
  function evPos(e){var s=toMin(e.start),en=toMin(e.end);if(en<=s)en=s+30;
    var top=(s-HS*60)/60*PH,h=(en-s)/60*PH;if(top<0){h+=top;top=0;}if(h<20)h=20;return{top:top,h:h};}
  function chkSVG(){return '<div class="chk" data-chk><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></div>';}
  function packLayout(evs){
    var items=evs.map(function(e){var s=toMin(e.start),en=Math.max(toMin(e.end),s+15);return{id:e.id,s:s,e2:en};});
    items.sort(function(a,b){return a.s-b.s||a.e2-b.e2;});
    var map={},group=[],groupEnd=-1;
    function flush(){var colsEnd=[];group.forEach(function(it){var placed=false;
      for(var c=0;c<colsEnd.length;c++){if(it.s>=colsEnd[c]){colsEnd[c]=it.e2;it.col=c;placed=true;break;}}
      if(!placed){it.col=colsEnd.length;colsEnd.push(it.e2);}});
      var n=colsEnd.length;group.forEach(function(it){map[it.id]={col:it.col,cols:n};});group=[];groupEnd=-1;}
    items.forEach(function(it){if(group.length&&it.s>=groupEnd)flush();group.push(it);groupEnd=Math.max(groupEnd,it.e2);});
    if(group.length)flush();
    return map;
  }
  function evHTML(e,withLabel,lay){var p=evPos(e);
    var lbl=withLabel?'<div class="lbl">'+(e.gcal?"Google 日历":esc(catName(e.cat))+(e.sub?" · "+esc(subName(e.cat,e.sub)):""))+'</div>':'';
    var box='top:'+p.top+'px;height:'+p.h+'px';
    if(lay&&lay.cols>1){var w=100/lay.cols;box+=';left:calc('+(w*lay.col)+'% + 1px);width:calc('+w+'% - 3px);right:auto';}
    var corner=e.gcal?'<span class="gtag" title="Google 日历">G</span>':chkSVG();
    return '<div class="ev'+(e.done?" done":"")+(e.gcal?" gcal":"")+'" data-id="'+e.id+'" style="--c:'+catColor(e.cat)+';'+box+'">'+
      '<div class="t">'+esc(e.title)+'</div><div class="h">'+e.start+'</div>'+lbl+corner+'</div>';}
  function hoursGutter(){var g="";for(var h=HS;h<=HE;h++)g+='<span style="top:'+((h-HS)*PH)+'px">'+pad(h)+':00</span>';return g;}
  function nowTop(){var n=new Date();var mins=n.getHours()*60+n.getMinutes();return(mins-HS*60)/60*PH;}
  function nowVisible(){var t=nowTop();return t>=0&&t<=GH;}

  function renderDay(){
    var d=state.cursor,ds=fmt(d),today=new Date();
    calTitle.innerHTML=(d.getMonth()+1)+"月"+d.getDate()+"日<em>周"+WD[(d.getDay()+6)%7]+"</em>";
    var dayEvents=eventsOn(ds);
    var catKeys=[];dayEvents.forEach(function(e){if(catKeys.indexOf(e.cat)<0)catKeys.push(e.cat);});
    catKeys.sort(function(a,b){return catIndex(a)-catIndex(b);});
    if(!catKeys.length){calBody.innerHTML='<div class="dv-empty">今天还没有安排，点右上「+ 事件」添加</div>';return;}
    var groups=catKeys.map(function(ck){
      var ce=dayEvents.filter(function(e){return e.cat===ck;});
      var defined=subsOf(ck),used={};ce.forEach(function(e){used[e.sub||"__none"]=true;});
      var subcols=[];
      defined.forEach(function(s){if(used[s.key])subcols.push({key:s.key,name:s.name});});
      var hasNone=ce.some(function(e){return !e.sub||!defined.some(function(s){return s.key===e.sub;});});
      if(hasNone||!subcols.length)subcols.push({key:"__none",name:subcols.length?"未细分":""});
      return{ck:ck,name:catName(ck),color:catColor(ck),subcols:subcols,events:ce};
    });
    var W=150;
    var head='<div class="dv-row-head">';
    var cols='<div class="dv-cols">';
    groups.forEach(function(g){
      head+='<div class="dv-gh" style="--c:'+g.color+';width:'+(g.subcols.length*W)+'px"><div class="dv-gh-name">'+esc(g.name)+'</div><div class="dv-gh-subs">';
      g.subcols.forEach(function(sc){head+='<div class="dv-sh">'+esc(sc.name)+'</div>';});
      head+='</div></div>';
      g.subcols.forEach(function(sc){
        var subEvs=g.events.filter(function(e){
          if(sc.key==="__none")return !e.sub||!subsOf(g.ck).some(function(s){return s.key===e.sub;});
          return e.sub===sc.key;
        });
        var lay=packLayout(subEvs);
        var evs=subEvs.map(function(e){return evHTML(e,false,lay[e.id]);}).join("");
        cols+='<div class="dv-col" data-date="'+ds+'" data-cat="'+g.ck+'" data-sub="'+(sc.key==="__none"?"":sc.key)+'" style="height:'+GH+'px">'+evs+'</div>';
      });
    });
    var totalW=groups.reduce(function(a,g){return a+g.subcols.length*W;},0);
    var nowLine=sameDay(d,today)&&nowVisible()?'<div class="now-line" style="top:'+nowTop()+'px;width:'+totalW+'px"></div>':'';
    cols+=nowLine+'</div>';
    head+='</div>';
    calBody.innerHTML='<div class="dv"><div class="dv-inner">'+
      '<div class="dv-time"><div class="dv-head-sp"></div><div class="dv-hours" style="height:'+GH+'px">'+hoursGutter()+'</div></div>'+
      '<div class="dv-body">'+head+cols+'</div></div></div>';
  }

  function renderWeek(){
    var start=startOfWeek(state.cursor),today=new Date(),end=addDays(start,6);
    calTitle.innerHTML=(start.getMonth()+1)+"月"+start.getDate()+"–"+(end.getMonth()!==start.getMonth()?(end.getMonth()+1)+"月":"")+end.getDate()+"日<em>"+start.getFullYear()+"</em>";
    var head='<div class="grid-head" style="grid-template-columns:46px repeat(7,1fr)"><div class="gh"></div>';
    var body='<div class="grid-body" style="grid-template-columns:46px repeat(7,1fr)"><div class="gutter" style="height:'+GH+'px">'+hoursGutter()+'</div>';
    var weekHasToday=false;
    for(var i=0;i<7;i++){
      var day=addDays(start,i),ds=fmt(day),isT=sameDay(day,today);if(isT)weekHasToday=true;
      head+='<div class="gh'+(isT?" today":"")+'"><div class="n">周'+WD[i]+'</div><div class="d" data-goday="'+ds+'">'+day.getDate()+'</div></div>';
      var dayEvs=eventsOn(ds),lay=packLayout(dayEvs);
      var evs=dayEvs.map(function(e){return evHTML(e,true,lay[e.id]);}).join("");
      body+='<div class="col'+(isT?" today":"")+'" data-date="'+ds+'" style="height:'+GH+'px">'+evs+'</div>';
    }
    head+='</div>';
    if(weekHasToday&&nowVisible())body+='<div class="now-line" style="left:46px;right:0;top:'+nowTop()+'px"></div>';
    body+='</div>';
    calBody.innerHTML='<div style="min-width:560px">'+head+body+'</div>';
  }

  function renderMonth(){
    var c=state.cursor,today=new Date();
    calTitle.innerHTML=c.getFullYear()+"年 "+(c.getMonth()+1)+"月";
    var first=new Date(c.getFullYear(),c.getMonth(),1),gstart=startOfWeek(first);
    var html='<div style="min-width:560px"><div class="m-head">';
    for(var w=0;w<7;w++)html+="<div>"+WD[w]+"</div>";
    html+='</div><div class="m-grid">';
    for(var i=0;i<42;i++){
      var day=addDays(gstart,i),ds=fmt(day),dim=day.getMonth()!==c.getMonth(),isT=sameDay(day,today);
      var evs=eventsOn(ds),pills="";
      for(var k=0;k<evs.length&&k<3;k++)pills+='<div class="pill" style="--c:'+catColor(evs[k].cat)+'"><i></i><b>'+esc(evs[k].title)+'</b></div>';
      if(evs.length>3)pills+='<div class="more">+'+(evs.length-3)+'</div>';
      html+='<div class="cell'+(dim?" dim":"")+(isT?" today":"")+'" data-date="'+ds+'" data-goday="'+ds+'"><div class="dn">'+day.getDate()+'</div>'+pills+'</div>';
    }
    calBody.innerHTML=html+'</div></div>';
  }
  function renderCal(){
    document.getElementById("view-seg").querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-v")===state.view);});
    if(state.view==="day")renderDay();else if(state.view==="month")renderMonth();else renderWeek();
    renderDashboard();
  }
  document.getElementById("view-seg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;state.view=b.getAttribute("data-v");renderCal();});
  document.getElementById("today-btn").addEventListener("click",function(){state.cursor=new Date();renderCal();});
  document.getElementById("prev-btn").addEventListener("click",function(){shift(-1);});
  document.getElementById("next-btn").addEventListener("click",function(){shift(1);});
  function shift(n){if(state.view==="day")state.cursor=addDays(state.cursor,n);else if(state.view==="week")state.cursor=addDays(state.cursor,n*7);else state.cursor=addMonths(state.cursor,n);renderCal();}
  document.getElementById("add-btn").addEventListener("click",function(){openModal(null,{date:fmt(state.cursor)});});

  calBody.addEventListener("click",function(e){
    var chk=e.target.closest("[data-chk]");
    if(chk){var evc=chk.closest(".ev");if(evc){var id=evc.getAttribute("data-id");
      events=events.map(function(x){return x.id===id?Object.assign({},x,{done:!x.done}):x;});save("tt_events",events);renderCal();}return;}
    var ev=e.target.closest(".ev");

  var aiOverlay=document.getElementById("ai-overlay"),aiInput=document.getElementById("ai-input"),aiResult=document.getElementById("ai-result");
  document.getElementById("ai-btn").addEventListener("click",function(){aiResult.innerHTML="";aiOverlay.classList.add("on");setTimeout(function(){aiInput.focus();},30);});
  function closeAI(){aiOverlay.classList.remove("on");}
  document.getElementById("ai-close").addEventListener("click",closeAI);
  aiOverlay.addEventListener("click",function(e){if(e.target===aiOverlay)closeAI();});
  aiInput.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();aiSend();}});
  document.getElementById("ai-send").addEventListener("click",aiSend);
  function aiMsg(html,cls){aiResult.innerHTML='<div class="ai-msg '+(cls||"")+'">'+html+'</div>';}
  function catKeyByName(nm){if(!nm)return null;for(var i=0;i<cats.length;i++)if(cats[i].name===nm)return cats[i].key;return null;}
  function aiSend(){
    var text=aiInput.value.trim();if(!text)return;
    if(!apiKey){aiMsg('还没设置 Gemini API Key —— 点左边 ⚙️，把你的 key 粘进去保存。',"err");return;}
    aiMsg('思考中…');
    var today=new Date(),ws=startOfWeek(today),wkMin=0;
    events.forEach(function(e){var d=parse(e.date);if(d>=ws&&d<=today)wkMin+=evMinutes(e);});
    var pend=todos.filter(function(t){return !t.done;}).length;
    var sys="你是个人时间管理 App 的助手。今天 "+fmt(today)+"（周"+WD[(today.getDay()+6)%7]+"）。"+
      "可用大类："+cats.map(function(c){return c.name;}).join("、")+"。"+
      "用户会用中文或英文说一句话，你判断ONE动作并只输出一个 JSON 对象：字段 action 为 \"create_event\"|\"create_todo\"|\"answer\"；"+
      "create_event 还要 title、date(YYYY-MM-DD)、start(HH:MM)、end(HH:MM)、category(从大类挑名字或留空)；"+
      "create_todo 还要 title、可选 due(YYYY-MM-DD)、可选 priority(high|mid|low)；"+
      "所有情况都要 reply(和用户同语言的简短确认或回答)。"+
      "参考：本周已安排约 "+(Math.round(wkMin/6)/10)+" 小时，未完成待办 "+pend+" 条。只输出 JSON。";
    var body={contents:[{role:"user",parts:[{text:sys+"\n\n用户："+text}]}],generationConfig:{responseMimeType:"application/json",temperature:0.2}};
    fetch("https://generativelanguage.googleapis.com/v1beta/models/"+apiModel+":generateContent?key="+encodeURIComponent(apiKey),
      {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.error){aiMsg("出错："+esc(j.error.message||"请求失败")+"（检查 key 是否正确）","err");return;}
        var c=j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0];
        var txt=c&&c.text;
        if(!txt){aiMsg("AI 没返回内容，换句话再试。","err");return;}
        var o;try{o=JSON.parse(txt);}catch(e){aiMsg("解析失败："+esc(txt),"err");return;}
        doAI(o,text);
      })
      .catch(function(err){aiMsg("网络错误："+esc(String(err))+"（若在预览页会被拦，请到你的网站上用）","err");});
  }
  function doAI(o,orig){
    if(o.action==="create_event"){
      var ck=catKeyByName(o.category)||autoCat(o.title||orig).cat;
      var ev={id:uid(),date:o.date||fmt(new Date()),start:o.start||"09:00",end:o.end||"10:00",title:o.title||orig,cat:ck,sub:null,done:false};
      events.push(ev);save("tt_events",events);renderCal();
      aiMsg("✅ "+esc(o.reply||"已加入日历")+"<br><span style='color:var(--muted);font-size:12px'>"+ev.date+" "+ev.start+"–"+ev.end+" · "+esc(catName(ck))+" · "+esc(ev.title)+"</span>","ok");
    }else if(o.action==="create_todo"){
      var td={id:uid(),title:o.title||orig,prio:(o.priority==="high"||o.priority==="low")?o.priority:"mid",due:o.due||"",done:false};
      todos.push(td);save("tt_todos",todos);renderTodos();
      aiMsg("✅ "+esc(o.reply||"已加入待办")+"<br><span style='color:var(--muted);font-size:12px'>"+esc(td.title)+(td.due?" · 截止 "+td.due:"")+"</span>","ok");
    }else{
      aiMsg(esc(o.reply||"（无回答）"),"ok");
    }
    aiInput.value="";
  }

  // ---------- Google Calendar 双向 ----------
  var gConnectBtn=document.getElementById("gcal-connect"),gStatusEl=document.getElementById("gcal-status"),tokenClient=null,silentMode=false;
  function gisReady(){return window.google&&google.accounts&&google.accounts.oauth2;}
  function initGis(){
    if(tokenClient||!gisReady())return;
    tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GCAL_CLIENT_ID,
      scope:"https://www.googleapis.com/auth/calendar.events",
      callback:function(resp){if(resp&&resp.access_token){gToken=resp.access_token;save("tt_gcal","1");save("tt_gtok",{t:gToken,exp:Date.now()+((resp.expires_in||3600)-60)*1000});onGcalConnected();}},
      error_callback:function(){if(!silentMode)gStatusEl.textContent="连接已取消或失败";}
    });
  }
  function updateGcalUI(){if(gToken){gConnectBtn.textContent="重新连接";}else{gConnectBtn.textContent="连接 Google Calendar";gStatusEl.textContent="未连接";}}
  gConnectBtn.addEventListener("click",function(){
    silentMode=false;initGis();
    if(!tokenClient){gStatusEl.textContent="Google 库未加载（预览页不支持，请到你的网站上用）";return;}
    gStatusEl.textContent="正在打开 Google 登录…";
    tokenClient.requestAccessToken({prompt:gToken?"":"consent"});
  });
  function trySilentGcal(){silentMode=true;initGis();if(tokenClient){try{tokenClient.requestAccessToken({prompt:"none"});}catch(e){}}}
  function onGcalConnected(){updateGcalUI();fetchGcal();}
  function fetchGcal(){
    if(!gToken)return;
    var lo=addDays(state.cursor,-31),hi=addDays(state.cursor,62);
    var url="https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=250"+
      "&timeMin="+encodeURIComponent(lo.toISOString())+"&timeMax="+encodeURIComponent(hi.toISOString());
    fetch(url,{headers:{Authorization:"Bearer "+gToken}}).then(function(r){return r.json();}).then(function(j){
      if(j.error){gStatusEl.textContent="读取失败："+(j.error.message||"");if(j.error.code===401){gToken=null;save("tt_gtok",null);updateGcalUI();}return;}
      gcalEvents=(j.items||[]).filter(function(it){return it.start&&it.start.dateTime;}).map(mapGEvent);
      gStatusEl.textContent="已连接 ✓（本区间 "+gcalEvents.length+" 个事件）";
      renderCal();
    }).catch(function(e){gStatusEl.textContent="网络错误："+e;});
  }
  function mapGEvent(it){
    var sd=new Date(it.start.dateTime),ed=new Date(it.end.dateTime||it.start.dateTime);
    return {id:"g_"+it.id,date:fmt(sd),start:pad(sd.getHours())+":"+pad(sd.getMinutes()),end:pad(ed.getHours())+":"+pad(ed.getMinutes()),title:it.summary||"(无标题)",cat:"meeting",sub:null,done:false,gcal:true};
  }
  var GEV="https://www.googleapis.com/calendar/v3/calendars/primary/events";
  function gBody(o){var tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
    return {summary:o.title,start:{dateTime:o.date+"T"+o.start+":00",timeZone:tz},end:{dateTime:o.date+"T"+o.end+":00",timeZone:tz}};}
  function gcalSync(obj,want){
    if(!gToken)return;
    if(want){
      if(obj.gid){fetch(GEV+"/"+encodeURIComponent(obj.gid),{method:"PATCH",headers:{Authorization:"Bearer "+gToken,"Content-Type":"application/json"},body:JSON.stringify(gBody(obj))}).then(function(){fetchGcal();}).catch(function(){});}
      else{fetch(GEV,{method:"POST",headers:{Authorization:"Bearer "+gToken,"Content-Type":"application/json"},body:JSON.stringify(gBody(obj))}).then(function(r){return r.json();}).then(function(j){if(j&&j.id){obj.gid=j.id;save("tt_events",events);}fetchGcal();}).catch(function(){});}
    }else if(obj.gid){var gid=obj.gid;obj.gid=null;save("tt_events",events);gcalDeleteById(gid);}
  }
  function gcalDeleteById(gid){if(!gToken||!gid)return;
    fetch(GEV+"/"+encodeURIComponent(gid),{method:"DELETE",headers:{Authorization:"Bearer "+gToken}}).then(function(){fetchGcal();}).catch(function(){});}
  updateGcalUI();
  (function(){
    var saved=load("tt_gtok",null);
    if(saved&&saved.t&&saved.exp>Date.now()){gToken=saved.t;onGcalConnected();return;}
    if(load("tt_gcal","")){var _gt=0,_gi=setInterval(function(){if(gisReady()){clearInterval(_gi);trySilentGcal();}else if(++_gt>40)clearInterval(_gi);},250);}
  })();

  // ---------- init ----------
  renderCal();drawPomo();renderPomoStats();renderTodos();
})();
</script>
